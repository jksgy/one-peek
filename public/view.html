<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一次性内容 · 一眼即焚</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0e1013;
    color: #e8e6e3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  .brand { font-size: 13px; color: #565b64; margin-bottom: 24px; letter-spacing: 2px; }
  .brand b { color: #ff6b35; }

  .state {
    width: 100%; max-width: 860px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    flex: 1;
  }
  .state .big { font-size: 56px; margin-bottom: 16px; }
  .state h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
  .state p { color: #8a8f98; font-size: 14px; line-height: 1.8; max-width: 420px; }

  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #262b33;
    border-top-color: #ff6b35;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .warn {
    margin-bottom: 18px;
    background: rgba(255,107,53,.1); border: 1px solid rgba(255,107,53,.35);
    border-radius: 10px; padding: 10px 16px;
    font-size: 13px; color: #ffb38a;
    max-width: 560px;
  }

  .progress { width: 100%; max-width: 560px; margin-top: 16px; }
  .progress .bar-bg { height: 8px; background: #1d222a; border-radius: 4px; overflow: hidden; }
  .progress .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff6b35, #ffb38a); transition: width .2s; }
  .progress .ptext { font-size: 12px; color: #8a8f98; margin-top: 6px; }

  .media-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; }
  img.content, video.content {
    max-width: 100%;
    max-height: 72vh;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    background: #000;
  }
  video.content { width: 100%; max-width: 860px; }

  .actions { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .actions a {
    background: #262b33; color: #e8e6e3; text-decoration: none;
    border-radius: 8px; padding: 10px 20px; font-size: 13px;
    border: 1px solid #3a4049;
  }
  .actions a:hover { border-color: #ff6b35; color: #ff8f5a; }
  .hint { margin-top: 14px; font-size: 12px; color: #565b64; line-height: 1.8; text-align: center; }
</style>
</head>
<body>
  <div class="brand">🔥 一眼<b>即焚</b> OnePeek</div>

  <!-- 加载中 -->
  <div class="state" id="stateLoading">
    <div class="spinner"></div>
    <h2>正在接收一次性内容…</h2>
    <div class="warn">⚠️ 本内容仅可查看这一次，关闭或刷新后将永久焚毁。如需保留请下载。</div>
    <div class="progress" id="dlProgress" style="display:none">
      <div class="bar-bg"><div class="bar" id="bar"></div></div>
      <div class="ptext" id="ptext"></div>
    </div>
  </div>

  <!-- 已焚毁 -->
  <div class="state" id="stateGone" style="display:none">
    <div class="big">🔥</div>
    <h2 id="goneTitle">内容已焚毁</h2>
    <p id="goneDesc">该链接的内容已被查看过或已过期，无法再次打开。</p>
  </div>

  <!-- 展示 -->
  <div class="media-wrap" id="stateMedia" style="display:none; width:100%; max-width:860px;">
    <div class="warn">🔥 内容已进入阅后即焚状态：本次关闭后将无法再次查看</div>
    <div class="media-wrap" id="mediaBox"></div>
    <div class="actions">
      <a id="downloadBtn" download>⬇️ 下载保存（关闭前）</a>
    </div>
    <p class="hint">刷新、换设备、换浏览器都无法再次查看 —— 这是一次性的</p>
  </div>

<script>
(function () {
  var token = location.pathname.replace(/^\/v\//, '').replace(/\/.*$/, '');
  var loading = document.getElementById('stateLoading');
  var gone = document.getElementById('stateGone');
  var media = document.getElementById('stateMedia');
  var mediaBox = document.getElementById('mediaBox');
  var dlProgress = document.getElementById('dlProgress');
  var bar = document.getElementById('bar');
  var ptext = document.getElementById('ptext');

  function showGone(title, desc) {
    loading.style.display = 'none';
    media.style.display = 'none';
    gone.style.display = 'flex';
    document.getElementById('goneTitle').textContent = title;
    document.getElementById('goneDesc').textContent = desc;
  }

  function fmtSize(n) {
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  function render(blob, mime, name) {
    var url = URL.createObjectURL(blob);
    var el;
    if (/^image\//.test(mime)) {
      el = document.createElement('img');
      el.className = 'content';
      el.alt = name;
    } else {
      el = document.createElement('video');
      el.className = 'content';
      el.controls = true;
      el.autoplay = false;
      el.playsInline = true;
    }
    el.src = url;
    mediaBox.appendChild(el);
    loading.style.display = 'none';
    media.style.display = 'flex';
    var dl = document.getElementById('downloadBtn');
    dl.href = url;
    dl.setAttribute('download', name || ('onepeek.' + (mime.split('/')[1] || 'bin')));
  }

  if (!token) return showGone('链接无效', '缺少内容标识');

  // 关键：只请求一次 /api/media，服务器在这次请求后即焚毁
  fetch('/api/media/' + encodeURIComponent(token), { cache: 'no-store' })
    .then(function (resp) {
      if (resp.status === 410) {
        var reason = '';
        try { reason = JSON.parse(resp.responseText || '{}').reason; } catch (e) {}
        var map = {
          viewed: '该内容已被查看过一次，链接已失效。',
          expired: '内容超过保留期限，已自动焚毁。',
          deleted: '分享者已手动销毁该内容。',
          missing: '内容文件已不存在。'
        };
        return { gone: map[reason] || map.viewed };
      }
      if (resp.status === 404) {
        return { gone: '链接不存在或已失效。' };
      }
      if (!resp.ok) {
        return { gone: '加载失败（' + resp.status + '）。' };
      }
      return resp;
    })
    .then(function (r) {
      if (r && r.gone !== undefined) return showGone('🔥 内容已焚毁', r.gone);

      var mime = r.headers.get('Content-Type') || 'application/octet-stream';
      var total = parseInt(r.headers.get('Content-Length') || '0', 10);
      var name = '内容';
      var cd = r.headers.get('Content-Disposition') || '';
      var mch = cd.match(/filename\*=UTF-8''([^;]+)/);
      if (mch) { try { name = decodeURIComponent(mch[1]); } catch (e) {} }

      if (r.body && r.body.getReader && total > 0) {
        // 带进度读取（视频可能较大）
        dlProgress.style.display = 'block';
        var reader = r.body.getReader();
        var chunks = [];
        var received = 0;
        return reader.read().then(function pump(step) {
          if (step.done) {
            return new Blob(chunks, { type: mime });
          }
          chunks.push(step.value);
          received += step.value.length;
          var pct = Math.round(received / total * 100);
          bar.style.width = pct + '%';
          ptext.textContent = '接收中… ' + pct + '%（' + fmtSize(received) + ' / ' + fmtSize(total) + '）';
          return reader.read().then(pump);
        });
      }
      return r.blob();
    })
    .then(function (blobOrUndefined) {
      if (!blobOrUndefined || !blobOrUndefined.type) return; // 已焚毁分支
      render(blobOrUndefined, blobOrUndefined.type, '内容');
    })
    .catch(function (e) {
      showGone('加载失败', '网络错误：' + (e && e.message ? e.message : e));
    });
})();
</script>
</body>
</html>
